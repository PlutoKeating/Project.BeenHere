name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check root documentation layout
        run: |
          unexpected="$(find . -maxdepth 1 -type f -name '*.md' ! -name README.md ! -name AGENTS.md -print)"
          test -z "$unexpected" || { echo "Move root Markdown into docs/: $unexpected"; exit 1; }
      - run: npm ci
      - run: npm run check
