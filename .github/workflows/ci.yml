name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [content-published]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Check root documentation layout
        run: |
          unexpected="$(find . -maxdepth 1 -type f -name '*.md' ! -name README.md ! -name AGENTS.md -print)"
          test -z "$unexpected" || { echo "Move root Markdown into docs/: $unexpected"; exit 1; }
      - run: npm ci
      - run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://beenhere.arr2018.dpdns.org
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture D1 recovery bookmark
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 time-travel info beenhere-archive --json > ../../d1-bookmark.json
      - name: Preserve D1 recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-bookmark-${{ github.sha }}
          path: d1-bookmark.json
          retention-days: 7
      - name: Migrate D1 and deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4.127.1"
          preCommands: wrangler d1 migrations apply beenhere-archive --remote
          command: deploy
      - name: Verify production
        run: curl --fail --retry 5 --retry-delay 3 https://beenhere.arr2018.dpdns.org/api/health
